<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Aura Fitness - Học, tập luyện và tiến bộ mỗi ngày." />
    
    <!-- Tối ưu hoá kết nối mạng & Preload tài nguyên critical -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preload" href="/aura-onboarding.webp" as="image" type="image/webp" fetchpriority="high" />

    
    <link rel="apple-touch-icon" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aura Fitness</title>
  </head>
  <body>
    
    <div id="root">
      <style>
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          height: 100dvh;
          background: #f8d7df;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .app-loader-spinner {
          width: 132px;
          height: 4px;
          overflow: hidden;
          border-radius: 99px;
          background: rgba(246,47,130,.16);
        }
        .app-loader-image {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: contain;
          object-position: center;
          will-change: filter, opacity, transform;
          animation: aura-image-focus 1.15s cubic-bezier(.22,.8,.26,1) both;
        }
        .app-loader-overlay {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(255,255,255,.02) 48%, rgba(35,13,24,.58) 100%);
          animation: aura-overlay-in .8s ease-out both;
        }
        .app-loader-spinner::after {
          content: "";
          display: block;
          width: 52%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, #f62f82, #ff8751);
          animation: aura-load 1.1s ease-in-out infinite alternate;
        }
        .app-loader-content { position: absolute; z-index: 2; right: 18px; bottom: max(22px, env(safe-area-inset-bottom)); left: 18px; display: flex; flex-direction: column; align-items: center; padding: 17px 18px 18px; border: 1px solid rgba(255,255,255,.7); border-radius: 24px; background: rgba(255,255,255,.76); box-shadow: 0 18px 48px rgba(58,21,38,.18); backdrop-filter: blur(18px) saturate(145%); -webkit-backdrop-filter: blur(18px) saturate(145%); animation: aura-content-rise .72s .12s cubic-bezier(.22,.8,.26,1) both; }
        .app-loader-copy { margin: 0 0 13px; color: transparent; background: linear-gradient(90deg, #f62f82 0%, #ff4f78 50%, #ff8751 100%); background-clip: text; -webkit-background-clip: text; font-size: clamp(15px, 4vw, 19px); font-weight: 900; line-height: 1.25; letter-spacing: -.02em; text-align: center; }
        @keyframes aura-image-focus { from { opacity: .38; filter: blur(15px); transform: scale(1.045); } to { opacity: 1; filter: blur(0); transform: scale(1); } }
        @keyframes aura-overlay-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes aura-content-rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (prefers-reduced-motion: reduce) {
          .app-loader-image, .app-loader-overlay, .app-loader-content, .app-loader-spinner::after { animation: none !important; filter: none !important; transform: none !important; }
        }
        @keyframes aura-load {
          from { transform: translateX(-15%); }
          to { transform: translateX(108%); }
        }
      </style>
      <div class="app-loader">
        <img src="/aura-onboarding.webp" alt="" class="app-loader-image" fetchpriority="high" />
        <div class="app-loader-overlay"></div>
        <div class="app-loader-content">
          <p class="app-loader-copy">Chào mừng bạn đến với Aura Fitness</p>
          <div class="app-loader-spinner" aria-label="Đang tải ứng dụng"></div>
        </div>
      </div>
    </div>
    <div id="aura-recaptcha-container" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
