<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/aura-icon-192.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Aura Fitness - Học, tập luyện và tiến bộ mỗi ngày." />
    
    <link rel="apple-touch-icon" href="/icons/aura-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aura Fitness</title>
  </head>
  <body>
    
    <div id="root">
      <style>
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          height: 100dvh;
          background:
            radial-gradient(circle at 18% 10%, rgba(255, 194, 221, .52), transparent 34%),
            radial-gradient(circle at 90% 84%, rgba(255, 203, 171, .46), transparent 32%),
            linear-gradient(180deg, #fffafb, #fff);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .app-loader-spinner {
          width: 132px;
          height: 4px;
          overflow: hidden;
          border-radius: 99px;
          background: rgba(246,47,130,.16);
        }
        .app-loader-brand { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 15px; border-radius: 20px; color: #fff; background: linear-gradient(135deg,#f42482,#ff7839); box-shadow: 0 18px 42px rgba(244,36,130,.22); font-size: 35px; font-weight: 900; }
        .app-loader-spinner::after {
          content: "";
          display: block;
          width: 52%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, #f62f82, #ff8751);
          animation: aura-load 1.1s ease-in-out infinite alternate;
        }
        .app-loader-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .app-loader-copy { margin: 0 0 13px; color: #17131c; font-size: clamp(20px, 5vw, 26px); font-weight: 900; line-height: 1.25; letter-spacing: -.03em; text-align: center; }
        @media (prefers-reduced-motion: reduce) {
          .app-loader-spinner::after { animation: none !important; transform: translateX(48%) !important; }
        }
        @keyframes aura-load {
          from { transform: translateX(-15%); }
          to { transform: translateX(108%); }
        }
      </style>
      <div class="app-loader">
        <div class="app-loader-content">
          <div class="app-loader-brand" aria-hidden="true">A</div>
          <p class="app-loader-copy">Aura Fitness</p>
          <div class="app-loader-spinner" aria-label="Đang tải ứng dụng"></div>
        </div>
      </div>
    </div>
    <div id="aura-recaptcha-container" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
