<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Aura Fitness - Học, tập luyện và tiến bộ mỗi ngày." />
    
    <!-- Tối ưu hoá kết nối mạng & Preload tài nguyên critical -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preload" href="/aura-onboarding.webp" as="image" type="image/webp" fetchpriority="high" />

    
    <link rel="apple-touch-icon" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aura Fitness</title>
  </head>
  <body>
    
    <div id="root">
      <style>
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          height: 100dvh;
          background: #f8d7df;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .app-loader-spinner {
          width: 132px;
          height: 4px;
          overflow: hidden;
          border-radius: 99px;
          background: rgba(255,255,255,.25);
        }
        .app-loader-image {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: contain;
          object-position: center;
        }
        .app-loader-overlay {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(255,255,255,.02) 48%, rgba(35,13,24,.58) 100%);
        }
        .app-loader-spinner::after {
          content: "";
          display: block;
          width: 52%;
          height: 100%;
          border-radius: inherit;
          background: #fff;
          animation: aura-load 1.1s ease-in-out infinite alternate;
        }
        .app-loader-content { position: absolute; z-index: 2; right: 24px; bottom: max(32px, env(safe-area-inset-bottom)); left: 24px; display: flex; flex-direction: column; align-items: center; }
        .app-loader-copy { margin: 0 0 18px; color: #fff; text-shadow: 0 2px 16px rgba(35,13,24,.4); font-size: 13px; font-weight: 850; letter-spacing: .16em; }
        @keyframes aura-load {
          from { transform: translateX(-15%); }
          to { transform: translateX(108%); }
        }
      </style>
      <div class="app-loader">
        <img src="/aura-onboarding.webp" alt="" class="app-loader-image" fetchpriority="high" />
        <div class="app-loader-overlay"></div>
        <div class="app-loader-content">
          <p class="app-loader-copy">AURA FITNESS</p>
          <div class="app-loader-spinner" aria-label="Đang tải ứng dụng"></div>
        </div>
      </div>
    </div>
    <div id="aura-recaptcha-container" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
