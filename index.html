<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Aura Fitness - Học, tập luyện và tiến bộ mỗi ngày." />
    
    <!-- Tối ưu hoá kết nối mạng & Preload tài nguyên critical -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    
    <link rel="apple-touch-icon" href="https://aurafitness.vn/wp-content/uploads/2023/11/LogoAura_Update_final2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aura Fitness</title>
  </head>
  <body>
    
    <div id="root">
      <style>
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          height: 100dvh;
          background: linear-gradient(145deg, #f62f82, #ff8751 72%, #17131a);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .app-loader-spinner {
          width: 132px;
          height: 4px;
          overflow: hidden;
          border-radius: 99px;
          background: rgba(255,255,255,.25);
        }
        .app-loader-spinner::after {
          content: "";
          display: block;
          width: 52%;
          height: 100%;
          border-radius: inherit;
          background: #fff;
          animation: aura-load 1.1s ease-in-out infinite alternate;
        }
        .app-loader-mark {
          display: grid;
          width: 76px;
          height: 76px;
          place-items: center;
          margin-bottom: 20px;
          border: 2px solid rgba(255,255,255,.78);
          border-radius: 24px;
          color: #fff;
          background: rgba(17,13,19,.18);
          box-shadow: 0 18px 45px rgba(43,14,28,.22);
          font-size: 42px;
          font-weight: 900;
        }
        .app-loader-copy { margin: 0 0 18px; color: #fff; font-size: 13px; font-weight: 750; letter-spacing: .16em; }
        @keyframes aura-load {
          from { transform: translateX(-15%); }
          to { transform: translateX(108%); }
        }
      </style>
      <div class="app-loader">
        <div class="app-loader-mark" aria-hidden="true">A</div>
        <p class="app-loader-copy">AURA FITNESS</p>
        <div class="app-loader-spinner" aria-label="Đang tải ứng dụng"></div>
      </div>
    </div>
    <div id="aura-recaptcha-container" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
