name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject committed credentials
        run: npm run security:secrets
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Install Functions dependencies for cross-layer tests
        run: npm --prefix functions ci
      - name: Run web unit and contract tests
        run: npm run test:profile-sync
      - name: Test callable inventory coverage
        run: npm run test:callable-audit
      - name: Test regional routing and function lifecycle safeguards
        run: |
          npm run test:regional-reads
          npm run test:function-lifecycle
          npm run test:data-cost
      - name: Build
        run: npm run build
      - name: Check performance budget
        run: npm run performance:check
      - name: Validate production configuration contract
        run: npm run production:gate -- --allow-pending-app-check
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.invalid
          VITE_FIREBASE_PROJECT_ID: ci-contract
          VITE_FIREBASE_STORAGE_BUCKET: ci-contract.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: ci-contract-app
          VITE_FIREBASE_DATABASE_ID: ci-contract-db
          VITE_ENABLE_DEMO_OTP: 'false'
          VITE_FORCE_DEMO: 'false'
          ENFORCE_APP_CHECK: 'false'
          ENFORCE_AI_APP_CHECK: 'false'

  functions:
    name: Functions checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Audit Functions production dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high
      - name: Check and test Functions
        run: npm --prefix functions run check
      - name: Test meal reminder policy
        run: npm --prefix functions run test:meal-reminders
      - name: Check API provider contract
        run: npm --prefix functions run check:apikey-fun

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Test production branch scheduling workspace
        if: matrix.project == 'chromium'
        run: npm run test:schedule-ui
      - name: Test contract renewal quote and confirmation flow
        if: matrix.project == 'chromium'
        run: npm run test:renewal-ui -- --project=renewal-chromium
      - name: Test contract renewal on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:renewal-ui -- --project=renewal-mobile-webkit
      - name: Test bounded loyalty pages and fresh balances
        if: matrix.project == 'chromium'
        run: npm run test:loyalty-operations-ui -- --project=loyalty-chromium
      - name: Test loyalty pagination on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:loyalty-operations-ui -- --project=loyalty-mobile-webkit
      - name: Test catalog loading and bounded autosave
        if: matrix.project == 'chromium'
        run: npm run test:catalog-ui -- --project=catalog-chromium
      - name: Test catalog on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:catalog-ui -- --project=catalog-mobile-webkit
      - name: Test event-driven workspace refresh
        if: matrix.project == 'chromium'
        run: npm run test:workspace-sync-ui -- --project=sync-chromium
      - name: Test listener and background read budgets
        if: matrix.project == 'chromium'
        run: npm run test:data-cost-ui
      - name: Test history pagination and fresh correction totals
        if: matrix.project == 'chromium'
        run: npx playwright test --config tests/training-history-panel-ui/playwright.config.ts --project=history-chromium
      - name: Test history totals on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npx playwright test --config tests/training-history-panel-ui/playwright.config.ts --project=history-mobile-webkit
      - name: Test workspace refresh on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:workspace-sync-ui -- --project=sync-mobile-webkit
      - name: Test independent dashboard reads and action center
        if: matrix.project == 'chromium'
        run: |
          npm run test:admin-dashboard-ui -- --project=dashboard-desktop
          npm run test:staff-dashboard-ui
          npm run test:action-center-ui
      - name: Test admin dashboard reads on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:admin-dashboard-ui -- --project=dashboard-mobile
      - name: Test independent nutrition tabs, reads and review workspace
        if: matrix.project == 'chromium'
        run: |
          npm run test:nutrition-ui -- --project=nutrition-desktop
          npm run test:nutrition-review-ui
      - name: Test nutrition reads on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:nutrition-ui -- --project=nutrition-mobile
      - name: Test daily progress summaries
        if: matrix.project == 'chromium'
        run: npm run test:progress-summary-ui -- --project=progress-chromium
      - name: Test daily progress summaries on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:progress-summary-ui -- --project=progress-mobile-webkit
      - name: Test event-driven delivery work on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:delivery-workspace-ui -- --project=delivery-mobile-webkit
      - name: Test persistent delivery map on Chromium
        if: matrix.project == 'chromium'
        run: npm run test:delivery-map-ui -- --project=map-chromium
      - name: Test persistent delivery map on mobile Safari
        if: matrix.project == 'mobile-webkit'
        run: npm run test:delivery-map-ui -- --project=map-mobile-webkit
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  rules:
    name: Rules (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: firestore
            script: test:rules
          - suite: storage
            script: test:storage
          - suite: rtdb
            script: test:rtdb
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test Rules
        run: npm run ${{ matrix.script }}
      - name: Install transaction test dependencies
        if: matrix.suite == 'firestore' || matrix.suite == 'rtdb'
        run: npm --prefix functions ci
      - name: Verify bounded GPS publishing and concurrent location writes
        if: matrix.suite == 'rtdb'
        run: npm run test:delivery-location-transaction
      - name: Verify atomic renewal and cross-region idempotency
        if: matrix.suite == 'firestore'
        run: npm run test:renewal-transaction
      - name: Verify projection concurrency and rebuild isolation
        if: matrix.suite == 'firestore'
        run: npm run test:projection-transaction
      - name: Verify nutrition revisions, summaries and partial projections
        if: matrix.suite == 'firestore'
        run: npm run test:nutrition-transaction
      - name: Verify refresh queue and renewal concurrency
        if: matrix.suite == 'firestore'
        run: npm run test:data-cost-transaction

  academy:
    name: Academy versioned learning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run test:academy
      - name: Generated Academy assets must match reviewed source
        run: git diff --exit-code -- functions/generated src/data/generated
      - run: node --test scripts/prepare-academy-release.test.cjs scripts/academy-release-gate.test.cjs scripts/performance-assets.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:academy-ui
      - run: npm run test:academy-storage
      - name: Upload Academy failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
