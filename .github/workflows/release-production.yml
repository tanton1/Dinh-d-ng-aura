name: Release production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref that has already passed CI
        required: true
        default: main
        type: string
      allow_pending_app_check:
        description: Compatibility rollout only; keep AI App Check enforcement disabled
        required: true
        default: false
        type: boolean
      backend_functions:
        description: Comma-separated Functions changed by this release; leave empty for frontend-only releases
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: aura-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Playwright's first install on a fresh runner can take ~20 minutes
    # (system dependencies + WebKit). Leave enough headroom for the full
    # E2E, schedule UI and emulator suites instead of cancelling mid-verify.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve immutable release revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm run ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:schedule-ui
      - run: npm run test:rules
      - run: npm run test:storage
      - run: npm run test:rtdb

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Resolve immutable release revision
        id: revision
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          test "$DEPLOY_SHA" = "$VERIFIED_SHA"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Require release credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT"

      - run: npm ci
      - run: npm --prefix functions ci

      - name: Enforce production configuration gate
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID || vars.VITE_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY || vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_ENABLE_DEMO_OTP: 'false'
          VITE_FORCE_DEMO: 'false'
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK }}
          ENFORCE_AI_APP_CHECK: ${{ vars.ENFORCE_AI_APP_CHECK }}
        run: |
          if [ "${{ inputs.allow_pending_app_check }}" = "true" ]; then
            npm run production:gate -- --allow-pending-app-check
          else
            npm run production:gate
          fi

      - name: Authenticate the production deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # New queries must never become live before their supporting indexes are
      # READY. The deploy helper is create-only and leaves every existing index
      # untouched.
      - name: Deploy Firestore indexes and wait until ready
        run: node scripts/firebase-firestore-index-deploy.cjs apply --confirm=projects/gen-lang-client-0815966909/databases/ai-studio-aurafitnesselear-0f7609b4-b8d1-4fb3-9d62-99a2c03e1ce7:create-missing-indexes

      - name: Validate backend deployment scope
        id: backend
        shell: bash
        env:
          BACKEND_FUNCTIONS: ${{ inputs.backend_functions }}
        run: |
          TARGETS="$(printf '%s' "$BACKEND_FUNCTIONS" | tr -d '[:space:]')"
          if [ -z "$TARGETS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Frontend-only release: Functions deployment skipped."
            exit 0
          fi
          if ! printf '%s' "$TARGETS" | grep -Eq '^[A-Za-z][A-Za-z0-9]*(,[A-Za-z][A-Za-z0-9]*)*$'; then
            echo "backend_functions must be a comma-separated list of exported Function names." >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Deploy backend Functions sequentially and require healthy revisions
        if: steps.backend.outputs.enabled == 'true'
        shell: bash
        env:
          BACKEND_FUNCTIONS: ${{ steps.backend.outputs.targets }}
          FUNCTIONS_DISCOVERY_TIMEOUT: 60
        run: |
          BEFORE_MANIFEST="$RUNNER_TEMP/firebase-functions-before.json"
          CURRENT_MANIFEST="$RUNNER_TEMP/firebase-functions-current.json"
          npx --yes firebase-tools@15.9.1 functions:list --project gen-lang-client-0815966909 --json > "$BEFORE_MANIFEST"

          rollback_previous() {
            local function_name="$1"
            local previous_region previous_service
            previous_region="$(node scripts/firebase-function-region.cjs --file="$BEFORE_MANIFEST" --function="$function_name" --field=region --allow-missing)"
            previous_service="$(node scripts/firebase-function-region.cjs --file="$BEFORE_MANIFEST" --function="$function_name" --field=service --allow-missing)"
            if [ -n "$previous_region" ] && [ -n "$previous_service" ]; then
              node scripts/cloud-run-functions-rollback.cjs \
                --functions="$previous_service" \
                --region="$previous_region" \
                --confirm="gen-lang-client-0815966909/$previous_region" || true
            fi
          }

          IFS=',' read -ra TARGETS <<< "$BACKEND_FUNCTIONS"
          for FUNCTION_NAME in "${TARGETS[@]}"; do
            echo "Deploying ${FUNCTION_NAME}..."
            if ! npx --yes firebase-tools@15.9.1 deploy --only "functions:${FUNCTION_NAME}" --project gen-lang-client-0815966909 --non-interactive; then
              rollback_previous "$FUNCTION_NAME"
              exit 1
            fi

            FUNCTION_REGION=""
            SERVICE_NAME=""
            for ATTEMPT in $(seq 1 12); do
              npx --yes firebase-tools@15.9.1 functions:list --project gen-lang-client-0815966909 --json > "$CURRENT_MANIFEST"
              FUNCTION_REGION="$(node scripts/firebase-function-region.cjs --file="$CURRENT_MANIFEST" --function="$FUNCTION_NAME" --field=region --allow-missing)"
              SERVICE_NAME="$(node scripts/firebase-function-region.cjs --file="$CURRENT_MANIFEST" --function="$FUNCTION_NAME" --field=service --allow-missing)"
              if [ -n "$FUNCTION_REGION" ] && [ -n "$SERVICE_NAME" ]; then break; fi
              sleep 5
            done
            if [ -z "$FUNCTION_REGION" ] || [ -z "$SERVICE_NAME" ]; then
              echo "Không xác định được region/service của ${FUNCTION_NAME} sau deploy." >&2
              rollback_previous "$FUNCTION_NAME"
              exit 1
            fi

            CONFIRMATION="gen-lang-client-0815966909/$FUNCTION_REGION"
            if ! node scripts/cloud-run-functions-promote-latest.cjs --functions="$SERVICE_NAME" --region="$FUNCTION_REGION" --confirm="$CONFIRMATION"; then
              node scripts/cloud-run-functions-rollback.cjs --functions="$SERVICE_NAME" --region="$FUNCTION_REGION" --confirm="$CONFIRMATION" || true
              exit 1
            fi
            if ! node scripts/cloud-run-functions-health.cjs --functions="$SERVICE_NAME" --region="$FUNCTION_REGION" --fail-on-unhealthy; then
              node scripts/cloud-run-functions-rollback.cjs --functions="$SERVICE_NAME" --region="$FUNCTION_REGION" --confirm="$CONFIRMATION"
              exit 1
            fi
          done

      - name: Deploy Security Rules
        run: npx --yes firebase-tools@15.9.1 deploy --only firestore:rules,storage --project gen-lang-client-0815966909 --non-interactive

      # Sensitive Vercel variables are deliberately returned as [SENSITIVE] by
      # `vercel env pull`. A local prebuilt deployment would compile those
      # placeholders into the client bundle. Always build remotely so Vercel
      # resolves the real production values inside its protected environment.
      - name: Build and promote production on Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --build-env VITE_APP_RELEASE=${{ steps.revision.outputs.sha }})"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke
        env:
          AURA_PROD_URL: ${{ steps.deploy.outputs.url }}
          AURA_EXPECTED_RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: npm run production:smoke

      - name: Release summary
        run: |
          echo "### Aura production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: \`${{ inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA: \`${{ steps.revision.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend Functions: \`${{ steps.backend.outputs.targets || 'skipped' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- App Check compatibility rollout: \`${{ inputs.allow_pending_app_check }}\`" >> "$GITHUB_STEP_SUMMARY"
